# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: 【DEV】Build and deploy Node.js app to Azure Web App - dev-mai-mind-map

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js version
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: npm install, build, and test
        run: |
          npm install -g pnpm
          pnpm install
          pnpm run build --if-present
          npm run test --if-present
          cd mai-mind-map-se
          pnpm install
          pnpm run build:server
          cd ..
          cd office-addin
          pnpm install
          pnpm run build
          cd ..

      - name: Zip artifact for deployment
        run: |
          cd mai-mind-map-se
          zip release.zip ./* -r
          cd ..

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: node-app
          path: ./mai-mind-map-se/release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write #This is required for requesting the JWT

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: node-app

      - name: Unzip artifact for deployment
        env:
          APP_CONFIG_DEV: ${{ secrets.APP_CONFIG_DEV }}
        shell: bash
        run: |
          unzip release.zip
          echo "$APP_CONFIG_DEV" > config.json

      - name: Login to Azure
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_939CCDD984A44AC88D225CF69F9EF117 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_22C8C080D66243088E4E5EC4568FDA22 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A1BE5DF37E694CC4B34D2F278563FC5D }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3.0.8
        with:
          app-name: 'dev-mai-mind-map'
          slot-name: 'Production'
          package: .
